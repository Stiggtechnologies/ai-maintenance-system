# Static application security testing (SAST) — ISO A.8.28/8.29, SOC 2 CC7.1.
name: CodeQL
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "27 3 * * 1" # weekly baseline
jobs:
  entitlement:
    name: CodeQL plan entitlement
    if: ${{ vars.CODEQL_ENABLED != 'true' }}
    runs-on: ubuntu-latest
    steps:
      - name: Record plan dependency
        run: |
          echo "::warning title=CodeQL unavailable on current private-repository plan::Upgrade to GitHub Team or Enterprise with GitHub Code Security, then set repository variable CODEQL_ENABLED=true."

  analyze:
    if: ${{ vars.CODEQL_ENABLED == 'true' }}
    name: CodeQL analysis
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      actions: read
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: github/codeql-action/init@db488ddef3bf6cb639b32c2e9a7c0a7ea8271d28 # v4
        with:
          languages: javascript-typescript
          queries: security-and-quality
      - uses: github/codeql-action/analyze@cdf488f595d80d6e07e03d4674febd5ab45fa938 # v4
