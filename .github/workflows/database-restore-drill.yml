name: Database restore drill

on:
  pull_request:
    paths:
      - ".github/workflows/database-restore-drill.yml"
      - "scripts/database-restore-*"
      - "src/test/databaseRestoreDrill.test.ts"
      - "supabase/migrations/**"
      - "supabase/config.toml"
      - "docs/enterprise-readiness/database-restore-drill.md"
  push:
    branches: [main]
    paths:
      - ".github/workflows/database-restore-drill.yml"
      - "scripts/database-restore-*"
      - "src/test/databaseRestoreDrill.test.ts"
      - "supabase/migrations/**"
      - "supabase/config.toml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: database-drill-${{ github.ref }}
  cancel-in-progress: false

jobs:
  local-database-restore:
    name: Isolated full-chain database restore
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22
      - uses: supabase/setup-cli@3c2f5e2ae34c34e428e8e206e2c4d21fa2d20fbf # v2.1.1
        with:
          version: 2.84.2
          github-token: ${{ github.token }}
      - name: Initialize the local source from the exact full migration chain
        run: supabase start
      - name: Restore into a new network-isolated database and qualify it
        env:
          SYNC_DR_LOCAL_SOURCE: supabase_db_ai-maintenance-system
        run: |
          node --input-type=module -e '
            import { runRestoreDrill } from "./scripts/database-restore-drill.mjs";
            import { writeFileSync } from "node:fs";
            await runRestoreDrill({ onReport: (report) => {
              writeFileSync("drill-summary.json", JSON.stringify(report, null, 2), {flag:"wx",mode:0o600});
              console.log(JSON.stringify({verdict:report.verdict,failedPhase:report.failedPhase,failureCategory:report.failureCategory,targetRemoved:report.targetRemoved}));
            }});
          '
      # Only the redacted report. Never upload database.dump, roles.sql, catalog
      # inventories, authentication hashes, bucket metadata or source payloads.
      - name: Preserve the bounded qualification summary
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: database-restore-drill-summary
          path: drill-summary.json
          if-no-files-found: error
          retention-days: 14
      - name: Stop the runner's local source
        if: always()
        run: supabase stop --no-backup
