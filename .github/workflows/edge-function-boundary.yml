name: Edge Function boundary

on:
  pull_request:
    paths:
      - ".github/workflows/deploy-migrations.yml"
      - ".github/workflows/edge-function-boundary.yml"
      - "config/edge-function-boundary.json"
      - "scripts/check-edge-function-boundary.mjs"
      - "supabase/functions/**"
  push:
    branches: [main]
    paths:
      - ".github/workflows/deploy-migrations.yml"
      - ".github/workflows/edge-function-boundary.yml"
      - "config/edge-function-boundary.json"
      - "scripts/check-edge-function-boundary.mjs"
      - "supabase/functions/**"

permissions:
  contents: read

jobs:
  verify:
    name: Verify approved deployment allowlist
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 22
      - run: node scripts/check-edge-function-boundary.mjs
