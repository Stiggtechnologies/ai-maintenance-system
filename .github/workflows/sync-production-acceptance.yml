name: Sync production acceptance

# Authenticated commissioning is separate from deployment presence. The deploy
# workflow proves schema/function/app boundaries; this workflow proves the real
# seeded demo tenant can execute the governed Sync interaction loop end to end.
#
# PRs run the deterministic harness self-test only. The live job stays SKIPPED
# on pull_request and whenever the founder secret is absent. Do not invent
# credentials. Merging a harness/workflow change to protected main triggers one
# real production commissioning run only when SUPABASE_ACCESS_TOKEN is set.
#
# Required for the live job (names only; values are founder-held):
#   - GitHub Actions secret SUPABASE_ACCESS_TOKEN
#     (Management API token; used only to discover a publishable/legacy-anon key)
# Optional live overrides (otherwise the seeded demo identity is used):
#   - SYNC_COMMISSIONING_EMAIL (default demo@syncai.ca)
#   - SYNC_COMMISSIONING_PASSWORD (default the seeded demo password)
# Founder/tenant gates the live job asserts; it does not flip them:
#   - demo org feature_flags.sync_global_shell = true
#   - demo org feature_flags.sync_tools = true
#   - seeded demo Reliability Engineer and Conveyor C-22 still present
#   - sync-investigation-runtime deployed and JWT-protected
# Stage-1 live ops (#384) and the manufacturing pack (#448) did not change this
# surface. The harness still uses /assets/:assetId and sync-investigation-runtime.
#
# Job-level `if` cannot read `secrets` (Unrecognized named-value). Presence is
# converted to a boolean output first, then the live job is skipped on that
# output so a missing token stays SKIPPED rather than paper-green SUCCESS.

on:
  pull_request:
    paths:
      - ".github/workflows/sync-production-acceptance.yml"
      - "scripts/sync-production-acceptance.mjs"
  push:
    branches: [main]
    paths:
      - ".github/workflows/sync-production-acceptance.yml"
      - "scripts/sync-production-acceptance.mjs"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

env:
  SUPABASE_PROJECT_ID: pjvoswbwomesuwhygpby

jobs:
  harness-self-test:
    name: Commissioning harness self-test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22
      - name: Test public-key selection, SSE parsing and completion assertions
        run: node scripts/sync-production-acceptance.mjs --self-test

  founder-secret-gate:
    name: Founder secret presence
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    outputs:
      has_token: ${{ steps.check.outputs.has_token }}
    steps:
      - id: check
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          if [ -n "${SUPABASE_ACCESS_TOKEN}" ]; then
            echo "has_token=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_token=false" >> "$GITHUB_OUTPUT"
            echo "Authenticated production acceptance will stay skipped: SUPABASE_ACCESS_TOKEN is not configured."
          fi

  production-acceptance:
    name: Authenticated production acceptance
    if: github.event_name != 'pull_request' && needs.founder-secret-gate.outputs.has_token == 'true'
    needs: [harness-self-test, founder-secret-gate]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22

      - name: Run authenticated Sync commissioning
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: node scripts/sync-production-acceptance.mjs

      - name: Record commissioning closure
        if: success()
        run: |
          cat >> "$GITHUB_STEP_SUMMARY" <<EOF
          ### Authenticated Sync production commissioning

          - Release: \`${GITHUB_SHA}\`
          - Authenticated demo Reliability Engineer: ✅
          - Required rollout flags: ✅
          - Lightweight + capability conversations: ✅
          - Operational investigation + truthful checks: ✅
          - Engineering diagnosis + retrieval: ✅
          - Regenerate/new server turn: ✅
          - Conversation lifecycle: ✅
          - Attachment grounding + provenance: ✅
          - Stop/cancellation: ✅
          - Governed proposal + confirmation + cleanup + idempotent replay: ✅
          - Persisted investigation checks/evidence/latency telemetry: ✅

          The governed archived Cowork commissioning conversation is the durable evidence packet. Per-turn latency values are retained in this run's logs.
          EOF

      - name: Raise commissioning failure issue
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          gh label create commissioning-failure --color B60205 \
            --description "authenticated Sync production commissioning is failing" 2>/dev/null || true
          TITLE="Sync production commissioning is failing"
          EXISTING=$(gh issue list --state open --label commissioning-failure \
            --json number --jq '.[0].number // empty')
          BODY=$(printf '%s\n' \
            "Authenticated Sync production acceptance failed on \`${SHA}\`." \
            "" \
            "Run: ${RUN_URL}" \
            "" \
            "Deployment presence may still be green; this issue means at least one tenant-level commissioning gate failed (rollout flag, authentication, runtime execution, trace/evidence, latency persistence, attachment grounding, cancellation, lifecycle, or governed action).")
          if [ -n "$EXISTING" ]; then
            gh issue comment "$EXISTING" --body "$BODY"
          else
            gh issue create --title "$TITLE" --label commissioning-failure --body "$BODY"
          fi

      - name: Close commissioning failure issue on success
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          for n in $(gh issue list --state open --label commissioning-failure --json number --jq '.[].number'); do
            gh issue close "$n" --comment "Authenticated production commissioning succeeded on ${GITHUB_SHA}. Closing."
          done
