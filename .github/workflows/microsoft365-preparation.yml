name: Microsoft 365 preparation
on:
  pull_request:
    paths:
      - 'integrations/microsoft365/**'
      - 'supabase/functions/marketplace-fulfillment/core.ts'
      - '.github/workflows/microsoft365-preparation.yml'
permissions:
  contents: read
jobs:
  adapter:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: integrations/microsoft365/package-lock.json
      - run: npm ci --ignore-scripts --no-audit --no-fund
        working-directory: integrations/microsoft365
      - run: npm test
        working-directory: integrations/microsoft365
