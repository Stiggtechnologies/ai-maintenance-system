name: Adapter SQL qualification
on:
  pull_request:
    paths:
      - "supabase/migrations/20270104090*.sql"
      - "supabase/functions/*read-pull/**"
      - "supabase/functions/_shared/adapter-*.ts"
      - "supabase/functions/_shared/adls-data-lake.ts"
      - "supabase/functions/_shared/p6-schedule-read.ts"
      - "supabase/functions/_shared/sap-s4-*-read.ts"
      - "scripts/adapter-canonical-fixture.ts"
      - "scripts/ci-adls-data-lake-smoke.sh"
      - "scripts/ci-p6-schedule-read-smoke.sh"
      - "scripts/ci-sap-s4-inventory-read-smoke.sh"
      - "scripts/ci-sap-s4-financial-read-smoke.sh"
      - ".github/workflows/adapter-qualification.yml"
permissions:
  contents: read
concurrency:
  group: adapter-sql-${{ github.ref }}
  cancel-in-progress: true
jobs:
  adapter-sql:
    name: Synthetic adapter canonical and isolation witness
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 22
      - uses: supabase/setup-cli@45a513f8c64c0bc8e0e3dfe572b5c95be85f6359
        with:
          version: 2.84.2
      - name: Fresh disposable Supabase chain
        id: start
        run: |
          if ! supabase start > /tmp/adapter-start.log 2>&1; then
            echo "Disposable Supabase startup failed"
            grep -E 'ERROR:|ERROR \(|failed to|Applying migration' /tmp/adapter-start.log | tail -20 || true
            exit 1
          fi
          echo "Disposable full migration chain started"
      - name: ADLS canonical provenance, replay and isolation
        run: bash scripts/ci-adls-data-lake-smoke.sh
      - name: P6 canonical schedule, replay and governed revisions
        if: ${{ !cancelled() && steps.start.outcome == 'success' }}
        run: bash scripts/ci-p6-schedule-read-smoke.sh
      - name: SAP inventory catalogue, UOM and replay
        if: ${{ !cancelled() && steps.start.outcome == 'success' }}
        run: bash scripts/ci-sap-s4-inventory-read-smoke.sh
      - name: SAP finance exact actuals and reconciliation
        if: ${{ !cancelled() && steps.start.outcome == 'success' }}
        run: bash scripts/ci-sap-s4-financial-read-smoke.sh
      - name: Adapter full-chain restore diagnostic
        if: ${{ !cancelled() && steps.start.outcome == 'success' }}
        env:
          SYNC_DR_LOCAL_SOURCE: supabase_db_ai-maintenance-system
        run: |
          node --input-type=module -e '
            import { runRestoreDrill } from "./scripts/database-restore-drill.mjs";
            await runRestoreDrill({ onReport: (report) => {
              console.log(JSON.stringify({verdict:report.verdict,failedPhase:report.failedPhase,failureCategory:report.failureCategory,inventoryMismatchSummary:report.inventoryMismatchSummary,targetRemoved:report.targetRemoved}));
            }});
          '
      - name: Stop disposable Supabase
        if: always()
        run: supabase stop --no-backup
