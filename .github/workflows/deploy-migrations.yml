name: Deploy migrations

# Pushes the deterministic migration chain and explicitly approved production
# Edge Functions after protected changes land on main. The allowlist is enforced
# by scripts/check-edge-function-boundary.mjs. Hosted Auth configuration is also
# applied and verified here because migrations cannot manage Supabase Auth URL,
# redirect allow-list, SMTP, or email-template settings.

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/deploy-migrations.yml"
      - "scripts/configure-production-auth.mjs"
      - "scripts/audit-material-production.mjs"
      - "scripts/audit-material-relationship-history.sql"
      - "supabase/migrations/**"
      - "supabase/functions/agent-loop-enrich/**"
      - "supabase/functions/cmms-read-pull/**"
      - "supabase/functions/ai-agent-processor/**"
      - "supabase/functions/autonomous-orchestrator/**"
      - "supabase/functions/azure-iot-operations-ingest/**"
      - "supabase/functions/_shared/azure-iot-operations-ingress.ts"
      - "supabase/functions/calculation-service/**"
      - "src/lib/value/**"
      - "supabase/functions/domain-specialist-run/**"
      - "supabase/functions/edge-evidence-ingest/**"
      - "src/lib/domain-specialists/**"
      - "supabase/functions/engineering-model-supply-chain/**"
      - "src/lib/engineering-models/**"
      - "engineering-model-packs/**"
      - "supabase/functions/develop-evidence-agent/**"
      - "supabase/functions/develop-gate-agent/**"
      - "supabase/functions/develop-handover-agent/**"
      - "supabase/functions/develop-operational-readiness-agent/**"
      - "supabase/functions/develop-methodology-agent/**"
      - "supabase/functions/develop-change-impact-agent/**"
      - "supabase/functions/develop-contract-strategy-agent/**"
      - "supabase/functions/develop-requirements-agent/**"
      - "supabase/functions/develop-risk-agent/**"
      - "supabase/functions/develop-benefits-agent/**"
      - "supabase/functions/develop-lessons-agent/**"
      - "supabase/functions/develop-governance-agent/**"
      - "supabase/functions/develop-hop-agent/**"
      - "supabase/functions/lead-notify/**"
      - "supabase/functions/marketplace-fulfillment/**"
      - "supabase/functions/marketplace-metering/**"
      - "supabase/functions/marketplace-webhook/**"
      - "supabase/functions/onboarding-enrich/**"
      - "supabase/functions/plant-historian-pull/**"
      - "supabase/functions/public-reliability-agent/**"
      - "supabase/functions/recovery-activation-pull/**"
      - "supabase/functions/sync-investigation-runtime/**"
      - "supabase/functions/sync-realtime-session/**"
      - "supabase/functions/sync-runtime/**"
      - "supabase/functions/sync-tts/**"
  workflow_dispatch:

concurrency:
  group: deploy-migrations
  cancel-in-progress: false

permissions:
  contents: read
  issues: write

env:
  SUPABASE_PROJECT_ID: pjvoswbwomesuwhygpby
  APP_URL: https://app.syncai.ca

jobs:
  material-history-preflight:
    name: Read-only material production history audit
    if: github.event_name == 'workflow_dispatch' && github.ref != 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Audit production history without deployment
        run: node scripts/audit-material-production.mjs
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}

  push-migrations:
    name: supabase db push and edge deploy
    # A manual non-main run is audit-only. Never deploy an unmerged branch.
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: supabase/setup-cli@45a513f8c64c0bc8e0e3dfe572b5c95be85f6359 # v3.0.1
        with:
          version: 2.84.2

      - name: Verify approved Edge Function boundary
        run: node scripts/check-edge-function-boundary.mjs

      - name: Link project
        run: supabase link --project-ref "$SUPABASE_PROJECT_ID"
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}

      - name: Configure and verify production Auth
        run: node scripts/configure-production-auth.mjs
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          ENTRA_SSO_CLIENT_ID: ${{ secrets.ENTRA_SSO_CLIENT_ID }}
          ENTRA_SSO_CLIENT_SECRET: ${{ secrets.ENTRA_SSO_CLIENT_SECRET }}
          ENTRA_SSO_TENANT: ${{ vars.ENTRA_SSO_TENANT }}

      - name: Configure Azure Marketplace publisher service
        env:
          AZURE_MARKETPLACE_CLIENT_ID: ${{ secrets.AZURE_MARKETPLACE_CLIENT_ID }}
          AZURE_MARKETPLACE_CLIENT_SECRET: ${{ secrets.AZURE_MARKETPLACE_CLIENT_SECRET }}
          AZURE_MARKETPLACE_TENANT_ID: ${{ secrets.AZURE_MARKETPLACE_TENANT_ID }}
          AZURE_MARKETPLACE_PUBLISHER_ID: ${{ secrets.AZURE_MARKETPLACE_PUBLISHER_ID }}
          AZURE_MARKETPLACE_OFFER_ID: ${{ secrets.AZURE_MARKETPLACE_OFFER_ID }}
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          set -euo pipefail
          present=0
          for name in AZURE_MARKETPLACE_CLIENT_ID AZURE_MARKETPLACE_CLIENT_SECRET AZURE_MARKETPLACE_TENANT_ID AZURE_MARKETPLACE_PUBLISHER_ID AZURE_MARKETPLACE_OFFER_ID; do
            if [ -n "${!name:-}" ]; then present=$((present + 1)); fi
          done
          if [ "$present" -eq 0 ]; then
            echo "::warning title=Azure Marketplace configuration unchanged::No publisher inputs were supplied by GitHub; the workflow is not changing any existing runtime secrets and this run is not end-to-end commerce evidence."
            exit 0
          fi
          if [ "$present" -ne 5 ]; then
            echo "::error title=Incomplete Azure Marketplace configuration::All five publisher and offer values must be supplied together."
            exit 1
          fi
          supabase secrets set --project-ref "$SUPABASE_PROJECT_ID" \
            AZURE_MARKETPLACE_CLIENT_ID="$AZURE_MARKETPLACE_CLIENT_ID" \
            AZURE_MARKETPLACE_CLIENT_SECRET="$AZURE_MARKETPLACE_CLIENT_SECRET" \
            AZURE_MARKETPLACE_TENANT_ID="$AZURE_MARKETPLACE_TENANT_ID" \
            AZURE_MARKETPLACE_PUBLISHER_ID="$AZURE_MARKETPLACE_PUBLISHER_ID" \
            AZURE_MARKETPLACE_OFFER_ID="$AZURE_MARKETPLACE_OFFER_ID"

      - name: Read-only material history preflight
        run: node scripts/audit-material-production.mjs
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}

      - name: Push migrations
        run: supabase db push --include-all
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}

      - name: Read-only material history post-migration audit
        run: node scripts/audit-material-production.mjs
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}

      - name: Deploy approved Edge Functions
        run: |
          supabase functions deploy agent-loop-enrich --no-verify-jwt
          supabase functions deploy ai-agent-processor
          supabase functions deploy autonomous-orchestrator
          supabase functions deploy azure-iot-operations-ingest --no-verify-jwt
          supabase functions deploy calculation-service
          supabase functions deploy cmms-read-pull
          supabase functions deploy domain-specialist-run
          supabase functions deploy edge-evidence-ingest --no-verify-jwt
          supabase functions deploy engineering-model-supply-chain
          supabase functions deploy develop-evidence-agent
          supabase functions deploy develop-gate-agent
          supabase functions deploy develop-handover-agent
          supabase functions deploy develop-operational-readiness-agent
          supabase functions deploy develop-methodology-agent
          supabase functions deploy develop-change-impact-agent
          supabase functions deploy develop-contract-strategy-agent
          supabase functions deploy develop-requirements-agent
          supabase functions deploy develop-risk-agent
          supabase functions deploy develop-benefits-agent
          supabase functions deploy develop-lessons-agent
          supabase functions deploy develop-governance-agent
          supabase functions deploy develop-hop-agent
          supabase functions deploy lead-notify
          supabase functions deploy marketplace-fulfillment --no-verify-jwt
          supabase functions deploy marketplace-metering
          supabase functions deploy marketplace-webhook --no-verify-jwt
          supabase functions deploy onboarding-enrich --no-verify-jwt
          supabase functions deploy plant-historian-pull
          supabase functions deploy public-reliability-agent
          supabase functions deploy recovery-activation-pull
          supabase functions deploy sync-investigation-runtime
          supabase functions deploy sync-realtime-session
          supabase functions deploy sync-runtime
          supabase functions deploy sync-tts
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}

      - name: Configure Azure Marketplace metering
        env:
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          MARKETPLACE_METER_PLAN_ID: ${{ vars.AZURE_MARKETPLACE_METER_PLAN_ID }}
          MARKETPLACE_METER_DIMENSION: ${{ vars.AZURE_MARKETPLACE_METER_DIMENSION }}
          MARKETPLACE_METER_UNIT_SIZE: ${{ vars.AZURE_MARKETPLACE_METER_UNIT_SIZE }}
          MARKETPLACE_METER_INCLUDED_QUANTITY: ${{ vars.AZURE_MARKETPLACE_METER_INCLUDED_QUANTITY }}
          MARKETPLACE_METER_QUANTITY_SCALE: ${{ vars.AZURE_MARKETPLACE_METER_QUANTITY_SCALE }}
        run: |
          set -euo pipefail
          present=0
          for name in MARKETPLACE_METER_PLAN_ID MARKETPLACE_METER_DIMENSION MARKETPLACE_METER_UNIT_SIZE MARKETPLACE_METER_INCLUDED_QUANTITY MARKETPLACE_METER_QUANTITY_SCALE; do
            if [ -n "${!name:-}" ]; then present=$((present + 1)); fi
          done
          if [ "$present" -eq 0 ]; then
            echo "::warning title=Azure Marketplace metering disabled::No protected metering configuration was supplied. Hourly dispatch remains unconfigured and no usage will be submitted."
            exit 0
          fi
          if [ "$present" -ne 5 ] || [ -z "${SUPABASE_SERVICE_ROLE_KEY:-}" ]; then
            echo "::error title=Incomplete Azure Marketplace metering configuration::The service role and all five plan-meter values must be supplied together."
            exit 1
          fi
          api="https://${SUPABASE_PROJECT_ID}.supabase.co/rest/v1/rpc"
          auth=(--header "apikey: ${SUPABASE_SERVICE_ROLE_KEY}" --header "authorization: Bearer ${SUPABASE_SERVICE_ROLE_KEY}" --header 'Content-Type: application/json')
          dimension_payload=$(jq -n \
            --arg plan "$MARKETPLACE_METER_PLAN_ID" \
            --arg dimension "$MARKETPLACE_METER_DIMENSION" \
            --argjson unit "$MARKETPLACE_METER_UNIT_SIZE" \
            --argjson included "$MARKETPLACE_METER_INCLUDED_QUANTITY" \
            --argjson scale "$MARKETPLACE_METER_QUANTITY_SCALE" \
            '{p_plan_id:$plan,p_dimension:$dimension,p_unit_size:$unit,p_included_quantity:$included,p_quantity_scale:$scale,p_active:true}')
          curl --fail-with-body --silent --show-error --request POST "${api}/configure_marketplace_meter_dimension" "${auth[@]}" --data "$dimension_payload"
          dispatch_payload=$(jq -n \
            --arg url "https://${SUPABASE_PROJECT_ID}.supabase.co/functions/v1/marketplace-metering" \
            --arg key "$SUPABASE_SERVICE_ROLE_KEY" \
            '{p_function_url:$url,p_service_key:$key}')
          curl --fail-with-body --silent --show-error --request POST "${api}/configure_marketplace_metering_dispatch" "${auth[@]}" --data "$dispatch_payload"
          echo "Azure Marketplace metering is configured for protected hourly dispatch."

      - name: Prove production migrations converged
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          set -euo pipefail
          output=$(supabase db push --dry-run --include-all 2>&1)
          printf '%s\n' "$output"
          if ! printf '%s\n' "$output" | grep -qi "up to date"; then
            echo "::error title=production migrations are not converged::A post-deploy dry run did not report the linked project as up to date."
            exit 1
          fi

      - name: Prove Sync Investigation Runtime is deployed
        run: |
          set -euo pipefail
          endpoint="https://${SUPABASE_PROJECT_ID}.supabase.co/functions/v1/sync-investigation-runtime"
          status=$(curl --silent --show-error --output /tmp/sync-runtime-probe.txt \
            --write-out '%{http_code}' \
            --request POST \
            --header 'Content-Type: application/json' \
            --data '{"query":"production commissioning boundary probe"}' \
            "$endpoint")
          cat /tmp/sync-runtime-probe.txt || true
          if [ "$status" != "401" ]; then
            echo "::error title=Sync Investigation Runtime boundary probe failed::Expected JWT-protected deployed function to return HTTP 401 without credentials; got HTTP ${status}."
            exit 1
          fi
          echo "Sync Investigation Runtime is deployed and JWT-protected (HTTP 401 unauthenticated)."

      - name: Prove Calculation Service is deployed
        run: |
          set -euo pipefail
          endpoint="https://${SUPABASE_PROJECT_ID}.supabase.co/functions/v1/calculation-service"
          status=$(curl --silent --show-error --output /tmp/calculation-service-probe.txt \
            --write-out '%{http_code}' \
            --request POST \
            --header 'Content-Type: application/json' \
            --data '{"action":"value_management","budget":0}' \
            "$endpoint")
          cat /tmp/calculation-service-probe.txt || true
          if [ "$status" != "401" ]; then
            echo "::error title=Calculation Service boundary probe failed::Expected JWT-protected deployed function to return HTTP 401 without credentials; got HTTP ${status}."
            exit 1
          fi
          echo "Calculation Service is deployed and JWT-protected (HTTP 401 unauthenticated)."

      - name: Prove Azure Marketplace Fulfillment is deployed
        run: |
          set -euo pipefail
          endpoint="https://${SUPABASE_PROJECT_ID}.supabase.co/functions/v1/marketplace-fulfillment"
          status=$(curl --silent --show-error --output /tmp/marketplace-fulfillment-probe.txt \
            --write-out '%{http_code}' \
            --request POST \
            --header 'Content-Type: application/json' \
            --data '{"action":"activate","resolutionId":"11111111-1111-4111-8111-111111111111","activationToken":"unauthenticated-boundary-probe-00000000"}' \
            "$endpoint")
          cat /tmp/marketplace-fulfillment-probe.txt || true
          if [ "$status" != "401" ]; then
            echo "::error title=Azure Marketplace Fulfillment boundary probe failed::Expected JWT-protected deployed function to return HTTP 401 without credentials; got HTTP ${status}."
            exit 1
          fi
          echo "Azure Marketplace Fulfillment is deployed; activation and status custom-auth refuse unauthenticated callers (HTTP 401)."

      - name: Prove Azure Marketplace Webhook is deployed
        run: |
          set -euo pipefail
          endpoint="https://${SUPABASE_PROJECT_ID}.supabase.co/functions/v1/marketplace-webhook"
          status=$(curl --silent --show-error --output /tmp/marketplace-webhook-probe.txt \
            --write-out '%{http_code}' \
            --request POST \
            --header 'Content-Type: application/json' \
            --data '{}' \
            "$endpoint")
          cat /tmp/marketplace-webhook-probe.txt || true
          if [ "$status" != "401" ]; then
            echo "::error title=Azure Marketplace Webhook boundary probe failed::Expected custom Microsoft JWT verification to return HTTP 401 without a bearer token; got HTTP ${status}."
            exit 1
          fi
          echo "Azure Marketplace Webhook is deployed and refuses unsigned lifecycle events (HTTP 401)."

      - name: Prove Azure Marketplace Metering is deployed
        run: |
          set -euo pipefail
          endpoint="https://${SUPABASE_PROJECT_ID}.supabase.co/functions/v1/marketplace-metering"
          status=$(curl --silent --show-error --output /tmp/marketplace-metering-probe.txt \
            --write-out '%{http_code}' \
            --request POST \
            --header 'Content-Type: application/json' \
            --data '{}' \
            "$endpoint")
          cat /tmp/marketplace-metering-probe.txt || true
          if [ "$status" != "401" ]; then
            echo "::error title=Azure Marketplace Metering boundary probe failed::Expected the service-only function to return HTTP 401 without credentials; got HTTP ${status}."
            exit 1
          fi
          echo "Azure Marketplace Metering is deployed and refuses unauthenticated usage submission (HTTP 401)."

      - name: Prove Sync Realtime Voice is deployed
        run: |
          set -euo pipefail
          endpoint="https://${SUPABASE_PROJECT_ID}.supabase.co/functions/v1/sync-realtime-session"
          status=$(curl --silent --show-error --output /tmp/sync-realtime-probe.txt \
            --write-out '%{http_code}' \
            --request POST \
            --header 'Content-Type: application/json' \
            --data '{"sdp":"unauthenticated-boundary-probe"}' \
            "$endpoint")
          cat /tmp/sync-realtime-probe.txt || true
          if [ "$status" != "401" ]; then
            echo "::error title=Sync Realtime boundary probe failed::Expected JWT-protected deployed function to return HTTP 401 without credentials; got HTTP ${status}."
            exit 1
          fi
          echo "Sync Realtime Voice is deployed and JWT-protected (HTTP 401 unauthenticated)."

      - name: Prove Recovery Activation adapter is deployed
        run: |
          set -euo pipefail
          endpoint="https://${SUPABASE_PROJECT_ID}.supabase.co/functions/v1/recovery-activation-pull"
          status=$(curl --silent --show-error --output /tmp/recovery-activation-probe.txt \
            --write-out '%{http_code}' \
            --request POST \
            --header 'Content-Type: application/json' \
            --data '{"connector_key":"boundary-probe","entity_type":"site","dry_run":true}' \
            "$endpoint")
          cat /tmp/recovery-activation-probe.txt || true
          if [ "$status" != "401" ]; then
            echo "::error title=Recovery Activation boundary probe failed::Expected JWT-protected deployed function to return HTTP 401 without credentials; got HTTP ${status}."
            exit 1
          fi
          echo "Recovery Activation adapter is deployed and JWT-protected (HTTP 401 unauthenticated)."

      - name: Prove Domain Specialist executor is deployed
        run: |
          set -euo pipefail
          endpoint="https://${SUPABASE_PROJECT_ID}.supabase.co/functions/v1/domain-specialist-run"
          status=$(curl --silent --show-error --output /tmp/domain-specialist-probe.txt \
            --write-out '%{http_code}' \
            --request POST \
            --header 'Content-Type: application/json' \
            --data '{}' \
            "$endpoint")
          cat /tmp/domain-specialist-probe.txt || true
          if [ "$status" != "401" ]; then
            echo "::error title=Domain Specialist boundary probe failed::Expected JWT-protected deployed function to return HTTP 401 without credentials; got HTTP ${status}."
            exit 1
          fi
          echo "Domain Specialist executor is deployed and JWT-protected (HTTP 401 unauthenticated)."

      - name: Prove Edge Evidence custom-auth boundary is deployed
        run: |
          set -euo pipefail
          endpoint="https://${SUPABASE_PROJECT_ID}.supabase.co/functions/v1/edge-evidence-ingest"
          status=$(curl --silent --show-error --output /tmp/edge-evidence-probe.txt \
            --write-out '%{http_code}' \
            --request POST \
            --header 'Content-Type: application/json' \
            --data '{}' \
            "$endpoint")
          cat /tmp/edge-evidence-probe.txt || true
          if [ "$status" != "401" ]; then
            echo "::error title=Edge Evidence boundary probe failed::Expected custom device authentication to return HTTP 401 without a signature; got HTTP ${status}."
            exit 1
          fi
          echo "Edge Evidence endpoint is deployed and refuses unsigned requests (HTTP 401)."

      - name: Prove HOP Agent is deployed
        run: |
          set -euo pipefail
          endpoint="https://${SUPABASE_PROJECT_ID}.supabase.co/functions/v1/develop-hop-agent"
          status=$(curl --silent --show-error --output /tmp/develop-hop-agent-probe.txt \
            --write-out '%{http_code}' \
            --request POST \
            --header 'Content-Type: application/json' \
            --data '{"lookback_days":30}' \
            "$endpoint")
          cat /tmp/develop-hop-agent-probe.txt || true
          if [ "$status" != "401" ]; then
            echo "::error title=HOP Agent boundary probe failed::Expected JWT-protected deployed function to return HTTP 401 without credentials; got HTTP ${status}."
            exit 1
          fi
          echo "HOP Agent is deployed and JWT-protected (HTTP 401 unauthenticated)."

      - name: Prove Plant historian adapter is deployed
        run: |
          set -euo pipefail
          endpoint="https://${SUPABASE_PROJECT_ID}.supabase.co/functions/v1/plant-historian-pull"
          status=$(curl --silent --show-error --output /tmp/plant-historian-probe.txt \
            --write-out '%{http_code}' \
            --request POST \
            --header 'Content-Type: application/json' \
            --data '{"connector_key":"boundary-probe","dry_run":true}' \
            "$endpoint")
          cat /tmp/plant-historian-probe.txt || true
          if [ "$status" != "401" ]; then
            echo "::error title=Plant historian boundary probe failed::Expected JWT-protected deployed function to return HTTP 401 without credentials; got HTTP ${status}."
            exit 1
          fi
          echo "Plant historian adapter is deployed and JWT-protected (HTTP 401 unauthenticated)."

      - name: Prove Azure IoT Operations ingress is deployed
        run: |
          set -euo pipefail
          endpoint="https://${SUPABASE_PROJECT_ID}.supabase.co/functions/v1/azure-iot-operations-ingest"
          status=$(curl --silent --show-error --output /tmp/azure-iot-ingress-probe.txt \
            --write-out '%{http_code}' --request GET "$endpoint")
          cat /tmp/azure-iot-ingress-probe.txt || true
          if [ "$status" != "405" ]; then
            echo "::error title=Azure IoT Operations ingress probe failed::Expected the deployed telemetry-only endpoint to refuse GET with HTTP 405; got HTTP ${status}."
            exit 1
          fi
          echo "Azure IoT Operations ingress is deployed and exposes POST only (HTTP 405 for GET)."

      - name: Prove CMMS read adapter is deployed
        run: |
          set -euo pipefail
          endpoint="https://${SUPABASE_PROJECT_ID}.supabase.co/functions/v1/cmms-read-pull"
          status=$(curl --silent --show-error --output /tmp/cmms-read-probe.txt \
            --write-out '%{http_code}' \
            --request POST \
            --header 'Content-Type: application/json' \
            --data '{"connector_key":"boundary-probe","dry_run":true}' \
            "$endpoint")
          cat /tmp/cmms-read-probe.txt || true
          if [ "$status" != "401" ]; then
            echo "::error title=CMMS read adapter boundary probe failed::Expected JWT-protected deployed function to return HTTP 401 without credentials; got HTTP ${status}."
            exit 1
          fi
          echo "CMMS read adapter is deployed and JWT-protected (HTTP 401 unauthenticated)."

      - name: Prove production app boundary is reachable
        run: |
          set -euo pipefail
          status=$(curl --silent --show-error --location --output /tmp/sync-app-probe.html \
            --write-out '%{http_code}' \
            --max-time 30 \
            "$APP_URL")
          if [ "$status" != "200" ]; then
            echo "::error title=production app boundary probe failed::Expected ${APP_URL} to return HTTP 200; got HTTP ${status}."
            exit 1
          fi
          echo "Production app boundary returned HTTP 200."

      - name: Give lead-notify a mail transport
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
        run: |
          set -euo pipefail
          if [ -z "${RESEND_API_KEY:-}" ]; then
            echo "::warning title=lead-notify has no mail transport::RESEND_API_KEY is not set as a repository secret, so lead-notify will mark every incoming lead 'failed' and neither the visitor nor the owner will be emailed. See docs/lead-response-sla.md."
            exit 0
          fi
          supabase secrets set RESEND_API_KEY="$RESEND_API_KEY"

      - name: Point the lead trigger at the deployed function
        env:
          LEAD_NOTIFY_SERVICE_KEY: ${{ secrets.LEAD_NOTIFY_SERVICE_KEY }}
        run: |
          set -euo pipefail
          if [ -z "${LEAD_NOTIFY_SERVICE_KEY:-}" ]; then
            echo "::warning title=lead-notify is not wired::LEAD_NOTIFY_SERVICE_KEY is not set, so private.lead_notify_config stays empty and trg_pilot_intake_notify will no-op. See docs/lead-response-sla.md."
            exit 0
          fi
          LEAD_FUNCTION_URL="https://${SUPABASE_PROJECT_ID}.supabase.co/functions/v1/lead-notify"
          LEAD_CONFIG_PAYLOAD=$(jq -cn \
            --arg url "$LEAD_FUNCTION_URL" \
            --arg key "$LEAD_NOTIFY_SERVICE_KEY" \
            '{p_function_url:$url,p_service_key:$key}')
          LEAD_CONFIG_STATUS=$(curl --silent --show-error \
            --output /tmp/lead-notify-config-response \
            --write-out '%{http_code}' \
            --request POST \
            "https://${SUPABASE_PROJECT_ID}.supabase.co/rest/v1/rpc/configure_lead_notify" \
            --header "apikey: ${LEAD_NOTIFY_SERVICE_KEY}" \
            --header "authorization: Bearer ${LEAD_NOTIFY_SERVICE_KEY}" \
            --header "content-type: application/json" \
            --data "$LEAD_CONFIG_PAYLOAD")
          if [ "$LEAD_CONFIG_STATUS" != "200" ] && [ "$LEAD_CONFIG_STATUS" != "204" ]; then
            echo "::error title=lead-notify configuration failed::configure_lead_notify returned HTTP ${LEAD_CONFIG_STATUS}."
            exit 1
          fi
          echo "lead-notify trigger target configured through the service-role RPC."

      - name: Raise a failure issue
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          gh label create deploy-failure --color B60205 \
            --description "deploy-migrations is failing; production is not advancing" 2>/dev/null || true
          TITLE="Deploy migrations is failing"
          EXISTING=$(gh issue list --state open --label deploy-failure \
            --json number --jq '.[0].number // empty')
          BODY=$(printf '%s\n' \
            "\`deploy-migrations\` failed on \`${SHA}\`." \
            "" \
            "Run: ${RUN_URL}" \
            "" \
            "**Production schema, Auth configuration, Edge Functions, and production boundary probes are not green.** The" \
            "frontend deploys independently on Vercel, so the app can keep" \
            "shipping against stale backend configuration — which looks" \
            "healthy right up until an authentication or schema path is exercised." \
            "" \
            "Check what production actually has:" \
            "" \
            '```bash' \
            "supabase migration list --linked" \
            "supabase db push --dry-run --include-all" \
            '```')
          if [ -n "$EXISTING" ]; then
            gh issue comment "$EXISTING" --body "$BODY"
            echo "commented on existing issue #${EXISTING}"
          else
            gh issue create --title "$TITLE" --label deploy-failure --body "$BODY"
          fi

      - name: Close the failure issue on success
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          for n in $(gh issue list --state open --label deploy-failure --json number --jq '.[].number'); do
            gh issue close "$n" --comment "Deploy and production boundary probes succeeded on ${GITHUB_SHA}. Closing."
          done
