name: Deploy migrations

# Pushes the deterministic migration chain and explicitly approved production
# Edge Functions after protected changes land on main. The allowlist is enforced
# by scripts/check-edge-function-boundary.mjs. Hosted Auth configuration is also
# applied and verified here because migrations cannot manage Supabase Auth URL,
# redirect allow-list, SMTP, or email-template settings.

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/deploy-migrations.yml"
      - "scripts/configure-production-auth.mjs"
      - "supabase/migrations/**"
      - "supabase/functions/agent-loop-enrich/**"
      - "supabase/functions/ai-agent-processor/**"
      - "supabase/functions/autonomous-orchestrator/**"
      - "supabase/functions/lead-notify/**"
      - "supabase/functions/onboarding-enrich/**"
      - "supabase/functions/public-reliability-agent/**"
      - "supabase/functions/sync-investigation-runtime/**"
      - "supabase/functions/sync-runtime/**"
  workflow_dispatch:

concurrency:
  group: deploy-migrations
  cancel-in-progress: false

permissions:
  contents: read
  issues: write

env:
  SUPABASE_PROJECT_ID: pjvoswbwomesuwhygpby
  APP_URL: https://app.syncai.ca

jobs:
  push-migrations:
    name: supabase db push and edge deploy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: supabase/setup-cli@v2
        with:
          version: 2.84.2
          github-token: ${{ github.token }}

      - name: Verify approved Edge Function boundary
        run: node scripts/check-edge-function-boundary.mjs

      - name: Link project
        run: supabase link --project-ref "$SUPABASE_PROJECT_ID"
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}

      - name: Configure and verify production Auth
        run: node scripts/configure-production-auth.mjs
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}

      - name: Push migrations
        run: supabase db push --include-all
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}

      - name: Deploy approved Edge Functions
        run: |
          supabase functions deploy agent-loop-enrich --no-verify-jwt
          supabase functions deploy ai-agent-processor
          supabase functions deploy autonomous-orchestrator
          supabase functions deploy lead-notify
          supabase functions deploy onboarding-enrich --no-verify-jwt
          supabase functions deploy public-reliability-agent
          supabase functions deploy sync-investigation-runtime
          supabase functions deploy sync-runtime
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}

      - name: Attest production migrations and Sync Edge Functions
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          set -euo pipefail

          MIGRATIONS="$(supabase migration list --linked 2>&1)"
          printf '%s\n' "$MIGRATIONS"

          NORMALIZED_MIGRATIONS="$(printf '%s\n' "$MIGRATIONS" | sed 's/│/|/g')"
          for VERSION in 20260921110000 20260921110100; do
            printf '%s\n' "$NORMALIZED_MIGRATIONS" | awk -F'|' -v expected="$VERSION" '
              {
                local=$1; remote=$2;
                gsub(/[[:space:]]/, "", local);
                gsub(/[[:space:]]/, "", remote);
                if (local == expected && remote == expected) found=1;
              }
              END { exit(found ? 0 : 1) }
            ' || {
              echo "::error title=Production migration missing::${VERSION} is not present in both local and linked remote migration history."
              exit 1
            }
          done

          FUNCTIONS="$(supabase functions list --project-ref "$SUPABASE_PROJECT_ID" 2>&1)"
          printf '%s\n' "$FUNCTIONS"
          for FUNCTION in sync-investigation-runtime sync-runtime; do
            printf '%s\n' "$FUNCTIONS" | grep -F "$FUNCTION" >/dev/null || {
              echo "::error title=Production Edge Function missing::${FUNCTION} is not listed in project ${SUPABASE_PROJECT_ID}."
              exit 1
            }
          done

          {
            echo "### Production release attestation"
            echo
            echo "- Commit: \`${GITHUB_SHA}\`"
            echo "- Linked migrations: \`20260921110000\`, \`20260921110100\` present remotely"
            echo "- Edge Functions: \`sync-investigation-runtime\`, \`sync-runtime\` listed in production"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Give lead-notify a mail transport
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
        run: |
          set -euo pipefail
          if [ -z "${RESEND_API_KEY:-}" ]; then
            echo "::warning title=lead-notify has no mail transport::RESEND_API_KEY is not set as a repository secret, so lead-notify will mark every incoming lead 'failed' and neither the visitor nor the owner will be emailed. See docs/lead-response-sla.md."
            exit 0
          fi
          supabase secrets set RESEND_API_KEY="$RESEND_API_KEY"

      - name: Point the lead trigger at the deployed function
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
          LEAD_NOTIFY_SERVICE_KEY: ${{ secrets.LEAD_NOTIFY_SERVICE_KEY }}
        run: |
          set -euo pipefail
          if [ -z "${SUPABASE_DB_URL:-}" ] || [ -z "${LEAD_NOTIFY_SERVICE_KEY:-}" ]; then
            echo "::warning title=lead-notify is not wired::SUPABASE_DB_URL and/or LEAD_NOTIFY_SERVICE_KEY are not set, so private.lead_notify_config stays empty and trg_pilot_intake_notify will no-op. Run configure_lead_notify() by hand — see docs/lead-response-sla.md."
            exit 0
          fi
          psql "$SUPABASE_DB_URL" \
            -v ON_ERROR_STOP=1 \
            -v url="https://${SUPABASE_PROJECT_ID}.supabase.co/functions/v1/lead-notify" \
            -v key="$LEAD_NOTIFY_SERVICE_KEY" \
            --no-psqlrc --quiet <<'SQL'
          select public.configure_lead_notify(:'url', :'key');
          SQL

      - name: Raise a failure issue
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          gh label create deploy-failure --color B60205 \
            --description "deploy-migrations is failing; production is not advancing" 2>/dev/null || true
          TITLE="Deploy migrations is failing"
          EXISTING=$(gh issue list --state open --label deploy-failure \
            --json number --jq '.[0].number // empty')
          BODY=$(printf '%s\n' \
            "\`deploy-migrations\` failed on \`${SHA}\`." \
            "" \
            "Run: ${RUN_URL}" \
            "" \
            "**Production schema, Auth configuration, and Edge Functions are not advancing.** The" \
            "frontend deploys independently on Vercel, so the app can keep" \
            "shipping against stale backend configuration — which looks" \
            "healthy right up until an authentication or schema path is exercised." \
            "" \
            "Check what production actually has:" \
            "" \
            '```bash' \
            "supabase migration list --linked" \
            '```')
          if [ -n "$EXISTING" ]; then
            gh issue comment "$EXISTING" --body "$BODY"
            echo "commented on existing issue #${EXISTING}"
          else
            gh issue create --title "$TITLE" --label deploy-failure --body "$BODY"
          fi

      - name: Close the failure issue on success
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          for n in $(gh issue list --state open --label deploy-failure --json number --jq '.[].number'); do
            gh issue close "$n" --comment "Deploy succeeded on ${GITHUB_SHA}. Closing."
          done
