name: Deploy migrations

# Pushes the deterministic migration chain and explicitly approved production
# Edge Functions after protected changes land on main. The allowlist is enforced
# by scripts/check-edge-function-boundary.mjs.

on:
  push:
    branches: [main]
    paths:
      - "supabase/migrations/**"
      - "supabase/functions/agent-loop-enrich/**"
      - "supabase/functions/ai-agent-processor/**"
      - "supabase/functions/autonomous-orchestrator/**"
      - "supabase/functions/lead-notify/**"
      - "supabase/functions/onboarding-enrich/**"
      - "supabase/functions/public-reliability-agent/**"
  workflow_dispatch:

concurrency:
  group: deploy-migrations
  cancel-in-progress: false

# Needed to raise the failure issue below. A deploy that fails silently is how
# six merges rotted behind a green CI.
permissions:
  contents: read
  issues: write

env:
  SUPABASE_PROJECT_ID: pjvoswbwomesuwhygpby

jobs:
  push-migrations:
    name: supabase db push and edge deploy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: supabase/setup-cli@v2
        with:
          version: 2.84.2
          github-token: ${{ github.token }}

      - name: Verify approved Edge Function boundary
        run: node scripts/check-edge-function-boundary.mjs

      - name: Link project
        run: supabase link --project-ref "$SUPABASE_PROJECT_ID"
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}

      # --include-all: branches merge in an order their timestamps do not always
      # agree with, so a migration can land sorting before the deployed head.
      # Without this flag `db push` refuses the entire batch rather than applying
      # the one straggler, which halts deployment for every later migration too.
      # check-migration-order.mjs keeps that case rare and reviewable at PR time;
      # this flag keeps it from taking production's schema offline when it happens.
      - name: Push migrations
        run: supabase db push --include-all
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}

      - name: Deploy approved Edge Functions
        run: |
          supabase functions deploy agent-loop-enrich --no-verify-jwt
          supabase functions deploy ai-agent-processor
          supabase functions deploy autonomous-orchestrator
          supabase functions deploy lead-notify
          supabase functions deploy onboarding-enrich --no-verify-jwt
          supabase functions deploy public-reliability-agent
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}

      # Nobody reads the Actions tab. This failed on every push for three weeks
      # while CI stayed green and Vercel kept shipping frontends over a schema
      # that was not moving. One open issue, reused rather than duplicated, so a
      # run of failures is one notification instead of a stream nobody triages.
      - name: Raise a failure issue
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          gh label create deploy-failure --color B60205 \
            --description "deploy-migrations is failing; production is not advancing" 2>/dev/null || true
          TITLE="Deploy migrations is failing"
          EXISTING=$(gh issue list --state open --label deploy-failure \
            --json number --jq '.[0].number // empty')
          BODY=$(printf '%s\n' \
            "\`deploy-migrations\` failed on \`${SHA}\`." \
            "" \
            "Run: ${RUN_URL}" \
            "" \
            "**Production schema and Edge Functions are not advancing.** The" \
            "frontend deploys independently on Vercel, so the app will keep" \
            "shipping against whatever schema was last applied — which looks" \
            "healthy right up until it isn't." \
            "" \
            "Check what production actually has:" \
            "" \
            '```bash' \
            "supabase migration list --linked" \
            '```')
          if [ -n "$EXISTING" ]; then
            gh issue comment "$EXISTING" --body "$BODY"
            echo "commented on existing issue #${EXISTING}"
          else
            gh issue create --title "$TITLE" --label deploy-failure --body "$BODY"
          fi

      - name: Close the failure issue on success
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          for n in $(gh issue list --state open --label deploy-failure --json number --jq '.[].number'); do
            gh issue close "$n" --comment "Deploy succeeded on ${GITHUB_SHA}. Closing."
          done
