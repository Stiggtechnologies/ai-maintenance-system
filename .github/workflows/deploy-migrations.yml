name: Deploy migrations

# Pushes the deterministic migration chain and explicitly approved production
# Edge Functions after protected changes land on main. The allowlist is enforced
# by scripts/check-edge-function-boundary.mjs.

on:
  push:
    branches: [main]
    paths:
      - "supabase/migrations/**"
      - "supabase/functions/agent-loop-enrich/**"
      - "supabase/functions/ai-agent-processor/**"
      - "supabase/functions/autonomous-orchestrator/**"
      - "supabase/functions/onboarding-enrich/**"
      - "supabase/functions/public-reliability-agent/**"
  workflow_dispatch:

concurrency:
  group: deploy-migrations
  cancel-in-progress: false

env:
  SUPABASE_PROJECT_ID: pjvoswbwomesuwhygpby

jobs:
  push-migrations:
    name: supabase db push and edge deploy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: supabase/setup-cli@v2
        with:
          version: 2.84.2
          github-token: ${{ github.token }}

      - name: Verify approved Edge Function boundary
        run: node scripts/check-edge-function-boundary.mjs

      - name: Link project
        run: supabase link --project-ref "$SUPABASE_PROJECT_ID"
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}

      - name: Push migrations
        run: supabase db push
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}

      - name: Deploy approved Edge Functions
        run: |
          supabase functions deploy agent-loop-enrich --no-verify-jwt
          supabase functions deploy ai-agent-processor
          supabase functions deploy autonomous-orchestrator
          supabase functions deploy onboarding-enrich --no-verify-jwt
          supabase functions deploy public-reliability-agent
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
