name: One-shot capture RE-2026.08

# HOW TO RUN THIS, AND WHAT IT CANNOT DO
#
# It had no `workflow_dispatch` trigger, so `gh workflow run` refused it and
# the only way to fire it was to open a pull request that edited this file --
# while the gate's own error message advertised it as the fallback capture
# route. Its `push` trigger also pointed at `feat/reliability-golden-baseline`,
# the branch of the now-closed PR #234.
#
# What it still CANNOT do, and why the OPENAI_API_KEY secret remains the real
# unblock:
#   - it captures the REFERENCE only. Qualifying a candidate change needs a
#     model credential in CI regardless;
#   - it snapshots production AS DEPLOYED, not this checkout;
#   - it sends publicOnly:true, which ai-agent-processor routes to a hardcoded
#     https://api.openai.com/v1/responses call (index.ts:402) that ignores
#     LLM_BASE_URL, so it does not traverse the Stigg AI Gateway and depends on
#     OPENAI_API_KEY being configured on the deployed edge function;
#   - it has never been executed. The key-selection fix in
#     scripts/capture-reliability-production-reference.mjs (prefer sb_secret_
#     over the legacy service_role JWT, which this project's edge functions
#     reject) is reasoned, not observed.

on:
  workflow_dispatch:
    inputs:
      commit_evidence:
        description: "Commit the captured reference to the dispatched branch"
        required: false
        default: true
        type: boolean
  pull_request:
    paths:
      - ".github/workflows/one-shot-capture-re-2026-08.yml"
      - "scripts/capture-reliability-production-reference.mjs"

permissions:
  contents: read

jobs:
  capture:
    name: Capture accepted Reliability Engineer outputs
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - run: npm ci --no-audit --no-fund

      - name: Verify production management credential exists
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          set -euo pipefail
          test -n "${SUPABASE_ACCESS_TOKEN:-}" || {
            echo "::error::SUPABASE_ACCESS_TOKEN is not configured; production reference capture cannot be trusted or fabricated."
            exit 1
          }

      # On a pull request this is a plumbing check only: it must not reach
      # production, and it must not fabricate a reference either.
      - name: Validate the capture script without calling production
        if: github.event_name == 'pull_request'
        run: node --check scripts/capture-reliability-production-reference.mjs

      - name: Capture unchanged RE-2026.08 through deployed processor
        if: github.event_name == 'workflow_dispatch'
        id: capture
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_ID: pjvoswbwomesuwhygpby
        run: |
          set -euo pipefail
          OUT="benchmarks/reliability-engineer/re-2026.08/reference-outputs.json"
          node scripts/capture-reliability-production-reference.mjs --output="$OUT"
          echo "evidence=$OUT" >> "$GITHUB_OUTPUT"

      - name: Commit the captured reference
        if: github.event_name == 'workflow_dispatch' && inputs.commit_evidence
        env:
          EVIDENCE: ${{ steps.capture.outputs.evidence }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$EVIDENCE"
          git commit -m "evidence(reliability): production reference capture from run ${{ github.run_id }}"
          git push origin "HEAD:${{ github.ref_name }}"

      - name: Upload immutable reference candidate
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v7
        with:
          name: re-2026-08-reference-outputs
          path: ${{ steps.capture.outputs.evidence }}
          retention-days: 30
