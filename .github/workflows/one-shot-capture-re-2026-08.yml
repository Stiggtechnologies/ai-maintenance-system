name: One-shot capture RE-2026.08

on:
  push:
    branches:
      - feat/reliability-golden-baseline
    paths:
      - ".github/workflows/one-shot-capture-re-2026-08.yml"
  pull_request:
    paths:
      - ".github/workflows/one-shot-capture-re-2026-08.yml"

permissions:
  contents: read

jobs:
  capture:
    name: Capture accepted Reliability Engineer outputs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - run: npm ci --no-audit --no-fund

      - name: Verify production management credential exists
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          set -euo pipefail
          test -n "${SUPABASE_ACCESS_TOKEN:-}" || {
            echo "::error::SUPABASE_ACCESS_TOKEN is not configured; production reference capture cannot be trusted or fabricated."
            exit 1
          }

      - name: Capture unchanged RE-2026.08 through deployed processor
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_ID: pjvoswbwomesuwhygpby
        run: |
          set -euo pipefail
          mkdir -p /tmp/re-2026-08
          node scripts/capture-reliability-production-reference.mjs \
            --output=/tmp/re-2026-08/reference-outputs.json

      - name: Upload immutable reference candidate
        uses: actions/upload-artifact@v7
        with:
          name: re-2026-08-reference-outputs
          path: /tmp/re-2026-08/reference-outputs.json
          retention-days: 30
