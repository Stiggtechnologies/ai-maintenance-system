name: One-shot Reliability Engineer core integration

on:
  push:
    branches:
      - agent/restore-reliability-core
    paths:
      - scripts/patch-reliability-core.mjs
      - .github/workflows/one-shot-reliability-core.yml

permissions:
  contents: write

jobs:
  integrate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: agent/restore-reliability-core
          fetch-depth: 0

      - name: Normalize escaped template literals in patcher
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('scripts/patch-reliability-core.mjs')
          s = p.read_text()
          s = s.replace('\\`${reliabilityPrompt}', '\\`\\${reliabilityPrompt}')
          s = s.replace('\\`${buildReliabilityEngineerPrompt({', '\\`\\${buildReliabilityEngineerPrompt({')
          p.write_text(s)
          PY

      - name: Apply integration patch
        run: node scripts/patch-reliability-core.mjs

      - name: Remove one-shot scaffolding
        run: rm scripts/patch-reliability-core.mjs .github/workflows/one-shot-reliability-core.yml

      - name: Commit generated integration
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- supabase/functions/ai-agent-processor/index.ts \
            supabase/functions/public-reliability-agent/index.ts \
            src/services/publicReliabilityAgent.ts \
            scripts/patch-reliability-core.mjs \
            .github/workflows/one-shot-reliability-core.yml
          git commit -m "feat(reliability): wire canonical core through governed runtime"
          git push origin HEAD:agent/restore-reliability-core
